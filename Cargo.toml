[package]
name = "rust-monitor"
version = "0.1.0"
edition = "2024"
description = "Lightweight system monitor that posts live server stats to a Discord webhook"
repository = "https://github.com/ZoniBoy00/rust-monitor"
license = "MIT"
keywords = ["monitoring", "discord", "system", "server", "webhook"]
categories = ["command-line-utilities", "monitoring"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.35"
chrono = "0.4"
